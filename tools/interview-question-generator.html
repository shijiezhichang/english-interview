function generate(){
 const type=document.getElementById('roleType').value;
 const level=document.getElementById('expLevel').value;
 const bank=questionBank[type][level];
 const shuffled=[...bank].sort(()=>Math.random()-0.5);
 const selected=shuffled.slice(0,5);
 const area=document.getElementById('questions');
 area.innerHTML='';
 selected.forEach((q,i)=>{
  const div=document.createElement('div');
  div.className='q-item';
  div.innerHTML=`<div class="q-num">${i+1}</div><div class="q-text"><div class="en">Q${i+1}: ${q.en}</div><div class="zh">${q.zh}</div></div>`;
  area.appendChild(div);
 });
 document.getElementById('btnRow').style.display='flex';
}
function showToast(){
 const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500);
}
document.getElementById('genTime').textContent=new Date().toLocaleString('zh-CN');
