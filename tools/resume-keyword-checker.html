<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>简历关键词检查 - English Interview工具集</title>
<meta name="description" content="粘贴简历和职位描述，高亮匹配未匹配的关键词，给出匹配度评分">
<meta name="keywords" content="简历优化,关键词检查,ATS,简历匹配度">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);color:#e0e0e0;min-height:100vh}
.wrap{max-width:900px;margin:0 auto;padding:20px}
header{text-align:center;padding:40px 20px 20px}
header h1{font-size:1.8rem;background:linear-gradient(90deg,#e94560,#ff6b6b);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
header p{color:#999;margin-top:6px;font-size:.9rem}
.card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:24px;margin:16px 0}
textarea{width:100%;min-height:140px;padding:14px 16px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:10px;color:#fff;font-size:.95rem;line-height:1.7;resize:vertical;outline:none;font-family:inherit}
textarea:focus{border-color:rgba(233,69,96,.5)}
textarea::placeholder{color:#666}
label{display:block;font-size:.9rem;color:#ccc;margin-bottom:6px;margin-top:14px}
.check-btn{margin-top:16px;padding:12px 32px;background:linear-gradient(90deg,#e94560,#ff6b6b);color:#fff;border:none;border-radius:10px;font-size:1rem;cursor:pointer;transition:opacity .2s;width:100%}
.check-btn:hover{opacity:.85}
.score-area{display:none;margin-top:24px}
.score-area.show{display:block}
.score-circle{width:120px;height:120px;border-radius:50%;margin:0 auto 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.score-circle .score{font-size:2.2rem;font-weight:700}
.score-circle .label{font-size:.75rem;color:#aaa}
.match-bar{height:8px;border-radius:4px;background:rgba(255,255,255,0.1);overflow:hidden;margin:6px 0}
.match-bar-fill{height:100%;border-radius:4px;transition:width .6s}
.result-section{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:18px 20px;margin:12px 0}
.result-section h3{font-size:1rem;color:#fff;margin-bottom:10px}
.keyword-tag{display:inline-block;padding:4px 12px;border-radius:14px;font-size:.82rem;margin:3px 4px}
.keyword-tag.matched{background:rgba(76,175,80,.2);color:#81c784;border:1px solid rgba(76,175,80,.3)}
.keyword-tag.missing{background:rgba(255,152,0,.2);color:#ffb74d;border:1px solid rgba(255,152,0,.3)}
.highlighted-text{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:14px 16px;font-size:.9rem;line-height:2;white-space:pre-wrap;max-height:300px;overflow-y:auto}
.highlighted-text .hl-match{background:rgba(76,175,80,.25);color:#a5d6a7;border-radius:3px;padding:1px 3px}
.highlighted-text .hl-miss{background:rgba(255,152,0,.25);color:#ffcc80;border-radius:3px;padding:1px 3px}
.suggestions{margin-top:14px}
.suggestion-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
.suggestion-item:last-child{border:none}
.sug-icon{font-size:1.1rem;flex-shrink:0;margin-top:2px}
.sug-text{font-size:.9rem;color:#ccc;line-height:1.5}
.back-link{display:inline-block;color:#ff8a8a;text-decoration:none;font-size:.9rem;margin-bottom:10px}
.back-link:hover{text-decoration:underline}
.tools-nav{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:16px 0;margin-top:10px;border-top:1px solid rgba(255,255,255,0.06)}
.tools-nav a{color:#aaa;text-decoration:none;font-size:.85rem;padding:5px 12px;border-radius:6px;background:rgba(255,255,255,0.03);transition:color .2s}
.tools-nav a:hover{color:#e94560}
.nav-links{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;padding:20px 0;margin-top:20px;border-top:1px solid rgba(255,255,255,0.08)}
.nav-links a{color:#ff8a8a;text-decoration:none;font-size:.9rem;padding:6px 14px;border-radius:8px;background:rgba(255,255,255,0.04);transition:background .2s}
.nav-links a:hover{background:rgba(233,69,96,.12)}
footer{text-align:center;padding:30px 20px;color:#666;font-size:.8rem;border-top:1px solid rgba(255,255,255,0.06);margin-top:20px}
.common-words={the:"a":"an":"and":"or":"but":"in":"on":"at":"to":"for":"of":"with":"by":"from":"is":"are":"was":"were":"be":"been":"being":"have":"has":"had":"do":"does":"did":"will":"would":"could":"should":"may":"might":"shall":"can":"need":"dare":"ought":"used":"it":"this":"that":"these":"those":"i":"you":"he":"she":"we":"they":"me":"him":"her":"us":"them":"my":"your":"his":"its":"our":"their":"mine":"yours":"hers":"ours":"theirs":"myself":"yourself":"himself":"herself":"itself":"ourselves":"themselves":"what":"which":"who":"whom":"whose":"where":"when":"why":"how":"all":"each":"every":"both":"few":"more":"most":"other":"some":"such":"no":"nor":"not":"only":"own":"same":"so":"than":"too":"very":"just":"because":"as":"until":"while":"about":"between":"through":"during":"before":"after":"above":"below":"up":"down":"out":"off":"over":"under":"again":"further":"then":"once":"here":"there":"also":"into":"if":"because":"until":"while":"whether":"and":"but":"or":"yet":"so":"that":"this":"these":"those":"am":"being":"having":"doing"};
const COMMON_WORDS=new Set(["the","a","an","and","or","but","in","on","at","to","for","of","with","by","from","is","are","was","were","be","been","being","have","has","had","do","does","did","will","would","could","should","may","might","shall","can","need","it","this","that","these","those","i","you","he","she","we","they","my","your","his","its","our","their","what","which","who","where","when","why","how","all","each","every","both","more","most","other","some","such","not","only","own","same","so","than","too","very","just","because","as","until","while","about","between","through","during","before","after","above","below","up","down","out","off","over","under","again","further","then","once","here","there","also","into","if"]);

function tokenize(text){
 return text.toLowerCase().replace(/[^a-z0-9\s\-_.\/@]/g,' ')
  .split(/\s+/).filter(w=>w.length>1).map(w=>w.replace(/^\d+$/,''));
}

function extractKeywords(text){
 const words=tokenize(text);
 const freq={};
 words.forEach(w=>{if(w.length>1&&!COMMON_WORDS.has(w))freq[w]=(freq[w]||0)+1});
 const sorted=Object.entries(freq).sort((a,b)=>b[1]-a[1]);
 return sorted.map(([word])=>word).slice(0,60);
}

function highlightText(text,keywords){
 const wordList=[...new Set(tokenize(text))];
 let result=text;
 // Build regex that matches resume words but prioritizes keyword matches
 const allChecks=new Set(keywords);
 wordList.forEach(w=>{if(allChecks.has(w))allChecks.add(w)});
 const escaped=[...allChecks].map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).filter(w=>w.length>0);
 if(escaped.length===0) return text;
 // Match longest words first
 escaped.sort((a,b)=>b.length-a.length);
 const regex=new RegExp(`\\b(${escaped.join('|')})\\b`,'gi');
 return result.replace(regex,(match)=>{
  if(keywords.has(match.toLowerCase())){
   return `<span class="hl-match">${match}</span>`;
  }
  return `<span class="hl-miss">${match}</span>`;
 });
}

function check(){
 const resumeText=document.getElementById('resume').value.trim();
 const jdText=document.getElementById('jd').value.trim();
 if(!resumeText||!jdText){alert('请同时填写简历内容和职位描述');return}

 const jdKeywords=new Set(extractKeywords(jdText));
 const resumeTokens=tokenize(resumeText);
 const resumeWords=new Set(resumeTokens);

 let matched=0;
 jdKeywords.forEach(k=>{if(resumeWords.has(k))matched++});
 const score=jdKeywords.size>0?Math.round(matched/jdKeywords.size*100):0;

 const scoreColor=score>=80?'#4caf50':score>=50?'#ff9800':'#f44336';
 const scoreBg=score>=80?'rgba(76,175,80,.15)':score>=50?'rgba(255,152,0,.15)':'rgba(244,67,54,.15)';

 const commonKeywords=extractCommonKeywords(jdKeywords,resumeWords);
 const missingKeywords=[...jdKeywords].filter(k=>!resumeWords.has(k)).slice(0,30);

 document.getElementById('scoreResult').innerHTML=`
  <div class="score-circle" style="background:${scoreBg};border:3px solid ${scoreColor}">
   <span class="score" style="color:${scoreColor}">${score}</span>
   <span class="label">匹配度</span>
  </div>
  <div style="text-align:center;color:#888;font-size:.9rem;margin-bottom:20px">${score>=80?'优秀！你的简历与JD高度匹配':score>=60?'良好，还有提升空间':score>=40?'一般，需要补充更多关键词':'较低，建议优化简历'}</div>
  <div class="result-section">
   <h3>✅ JD 中的关键词（${jdKeywords.size}个）</h3>
   <div style="margin-top:8px">
    ${[...jdKeywords].slice(0,50).map(k=>`<span class="keyword-tag ${resumeWords.has(k)?'matched':'missing'}">${k}${resumeWords.has(k)?' ✓':' ✗'}</span>`).join('')}
    ${[...jdKeywords].length>50?`<span style="color:#666;font-size:.82rem">  +${[...jdKeywords].length-50} 更多</span>`:''}
   </div>
  </div>
  ${missingKeywords.length>0?`<div class="result-section">
   <h3>⚠️ 简历中缺失的关键词（${missingKeywords.length}个）</h3>
   <div style="margin-top:8px">
    ${missingKeywords.map(k=>`<span class="keyword-tag missing">${k}</span>`).join('')}
   </div>
  </div>`:''}
  <div class="result-section">
   <h3>💡 优化建议</h3>
   <div class="suggestions">
    ${score<80?`<div class="suggestion-item"><span class="sug-icon">📌</span><span class="sug-text">在简历中补充以下关键词：${[...new Set(missingKeywords.slice(0,5))].join('、')}等</span></div>`:''}
    <div class="suggestion-item"><span class="sug-icon">📌</span><span class="sug-text">使用JD中的原词来描述你的经历，避免近义词替换</span></div>
    ${missingKeywords.length>10?`<div class="suggestion-item"><span class="sug-icon">📌</span><span class="sug-text">缺失关键词较多（${missingKeywords.length}个），建议针对此JD定制简历版本</span></div>`:''}
    <div class="suggestion-item"><span class="sug-icon">📌</span><span class="sug-text">确保关键词在简历中自然出现，避免堆砌</span></div>
    <div class="suggestion-item"><span class="sug-icon">📌</span><span class="sug-text">在技能（Skills）和工作经历（Experience）部分都要包含关键词</span></div>
   </div>
  </div>
 `;
 document.getElementById('scoreArea').classList.add('show');
}

function extractCommonKeywords(jdKeys,resumeWords){
 const result={};
 jdKeys.forEach(k=>{
  const kLower=k.toLowerCase();
  if(resumeWords.has(kLower)){result[k]=true;return}
  // partial match
  resumeWords.forEach(r=>{
   if(kLower.includes(r)||r.includes(kLower)){result[k]=true}
  });
 });
 return Object.keys(result);
}

document.getElementById('genTime').textContent=new Date().toLocaleString('zh-CN');
</script>
</body>
</html>
